<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Valombre — Les Éclats de l'Aube</title>
<style>
  html, body { margin: 0; height: 100%; background: #07080a; overflow: hidden; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; outline: none; }
  #ui { position: fixed; inset: 0; pointer-events: none; }
  #boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
          background: #07080a; color: #cdb98a; font-family: Georgia, 'Times New Roman', serif; letter-spacing: 0.08em; z-index: 50; }
  #boot h1 { font-weight: normal; font-size: 44px; margin: 0 0 6px; letter-spacing: 0.3em; }
  #boot p { margin: 4px 0 22px; opacity: 0.7; font-size: 14px; }
  #bootbar { width: 320px; height: 3px; background: #2a2620; }
  #bootfill { height: 100%; width: 0; background: #cdb98a; transition: width 0.2s; }
  #bootmsg { margin-top: 12px; font-size: 12px; opacity: 0.6; min-height: 16px; }
  #debug { position: fixed; left: 8px; top: 8px; color: #dfe7d0; font: 12px/1.35 Consolas, monospace; white-space: pre;
           text-shadow: 0 1px 2px #000; pointer-events: none; z-index: 40; display: none; }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.js", "three/addons/": "./vendor/three/addons/" } }
</script>
</head>
<body>
<canvas id="game" tabindex="0"></canvas>
<div id="ui"></div>
<div id="debug"></div>
<div id="boot">
  <h1>VALOMBRE</h1>
  <p>Les Éclats de l'Aube</p>
  <div id="bootbar"><div id="bootfill"></div></div>
  <div id="bootmsg">Chargement…</div>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
